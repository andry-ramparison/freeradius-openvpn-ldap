services:
  ldap:
    image: osixia/openldap:1.5.0
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost -b dc=esti,dc=lab -D cn=admin,dc=esti,dc=lab -w \"$$LDAP_ADMIN_PASSWORD\" -s base dn || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    container_name: p16-ldap
    environment:
      LDAP_ORGANISATION: "ESTI Lab"
      LDAP_DOMAIN: "esti.lab"
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      LDAP_CONFIG_PASSWORD: ${LDAP_CONFIG_PASSWORD}
    command: --copy-service
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ./openldap/config:/container/service/slapd/assets/config/bootstrap/ldif/custom
    ports:
      - "127.0.0.1:389:389"
      - "127.0.0.1:636:636"
    networks: [lab]

  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: p16-phpldapadmin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: ldap
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "127.0.0.1:8080:80"
    depends_on: [ldap]
    networks: [lab]

  freeradius:
    image: freeradius/freeradius-server:3.2.3
    container_name: p16-freeradius
    command: -X
    environment:
      LDAP_READER_PASSWORD: ${LDAP_READER_PASSWORD}
      RADIUS_SECRET: ${RADIUS_SECRET}
    volumes:
      - ./freeradius/config/mods-enabled/ldap:/etc/freeradius/mods-enabled/ldap:ro
      - ./freeradius/config/sites-available/default:/etc/freeradius/sites-available/default:ro
      - ./freeradius/config/clients.conf:/etc/freeradius/clients.conf:ro
    depends_on:
      ldap:
        condition: service_healthy
    networks: [lab]
    restart: on-failure

volumes:
  ldap_data:
  ldap_config:

networks:
  lab:
    driver: bridge
