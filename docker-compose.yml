services:
  ldap:
    image: osixia/openldap:1.5.0
    container_name: p16-ldap
    environment:
      LDAP_ORGANISATION: "ESTI Lab"
      LDAP_DOMAIN: "esti.lab"
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      LDAP_CONFIG_PASSWORD: ${LDAP_CONFIG_PASSWORD}
    command: --copy-service
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ./openldap/config:/container/service/slapd/assets/config/bootstrap/ldif/custom
    ports:
      - "127.0.0.1:389:389"
      - "127.0.0.1:636:636"
    networks: [lab]

  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: p16-phpldapadmin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: ldap
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "127.0.0.1:8080:80"
    depends_on: [ldap]
    networks: [lab]

volumes:
  ldap_data:
  ldap_config:

networks:
  lab:
    driver: bridge
