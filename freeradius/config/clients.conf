client localhost {
    ipaddr = 127.0.0.1
    secret = $ENV{RADIUS_SECRET}
}
# Compose utilise un sous-reseau prive dans 172.16.0.0/12; cela couvre
# OpenVPN et evite de dependre de la resolution DNS au demarrage de RADIUS.
client reseau-docker {
    ipaddr = 172.16.0.0/12
    secret = $ENV{RADIUS_SECRET}
}
